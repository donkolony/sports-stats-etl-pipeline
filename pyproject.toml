[project]
name = "sports-stats-etl-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Don Kolony", email = "donkolony@gmail.com" }
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "dotenv>=0.9.9",
    "duckdb>=1.5.5",
    "requests>=2.34.2",
]

[project.scripts]
sports-stats-etl-pipeline = "sports_stats_etl_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.0",
]
